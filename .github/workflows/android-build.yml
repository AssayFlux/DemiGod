name: Android build

on:
  push:
    branches: [Heaven]
  pull_request:
    branches: [Heaven]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Python for AirLLM bridge validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate AirLLM bridge syntax
        run: python -m py_compile airllm/server.py
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build, test and lint
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: demigod-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
